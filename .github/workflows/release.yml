name: release
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    permissions:
      contents: write
      id-token: write # crates.io trusted publishing + attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.0"
      # A crate that depends on lucida-analytics keeps path = "../rust" for development (cargo package drops it):
      # the base SDK's public source must sit beside the checkout, as in ci.yml.
      - run: if grep -q 'path = "../rust"' Cargo.toml; then git clone --depth 1 https://github.com/lucidaanalytics/lucida-rust "$GITHUB_WORKSPACE/../rust"; fi
      - run: cargo package --locked
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/package/*.crate
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/package/*.crate --generate-notes --verify-tag
      # Trusted publishing (register this repo and release.yml on crates.io, docs/guides/sdk-releases.md), or a
      # CARGO_REGISTRY_TOKEN repository secret for the first release (a crate must exist before trusted publishing).
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
        if: env.HAS_CARGO_TOKEN != 'true'
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
